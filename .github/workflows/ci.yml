name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The package is installed without its dependency list on purpose: that list carries
      # Kokoro and its PyTorch stack, which no test needs. What the tests import is listed here.
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install pytest ruff mypy httpx numpy cryptography qrcode Pillow

      # The Windows desktop-control code (the `computer` extra) and the TTS startup lifecycle
      # import pywin32 and the WinRT projections; their tests run only on this OS.
      - name: Install Windows-only dependencies
        if: runner.os == 'Windows'
        run: >
          python -m pip install "pywin32>=311"
          "winrt-Windows.Foundation>=3.2.1" "winrt-Windows.Foundation.Collections>=3.2.1"
          "winrt-Windows.Globalization>=3.2.1" "winrt-Windows.Graphics.Imaging>=3.2.1"
          "winrt-Windows.Media.Ocr>=3.2.1"

      - name: Run tests
        run: python -m pytest -q

      - name: Run lint
        run: python -m ruff check .

      - name: Run type checks
        run: python -m mypy src
